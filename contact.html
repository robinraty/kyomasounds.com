<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">
    
    <!-- JavaScript -->
    <script src="scripts/main.js" defer></script>
    
    <title>Contact | Kyoma Sounds</title>
</head>

<body class="contact-body">
    
    <!-- =========================
    HEADER / NAVBAR
    ========================== -->
    
    <header class="music-header">
        <div class="container">
            
            <nav class="navbar">
                <a href="index.html" class="navbar__logo">KYOMA</a>
                
                <button class="navbar__toggle" aria-label="Open menu">
                    <span></span>
                    <span></span>
                </button>
                
                <ul class="navbar__links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="playlists.html">Playlists</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>

                <div class="navbar__social-links">
                    <a href="#" aria-label="Spotify">
                        <img src="assets/icons/spotify.svg" alt="Spotify" class="spotify-icon">
                    </a>
                    
                    <a href="#" aria-label="YouTube">
                        <img src="assets/icons/youtube.svg" alt="YouTube" class="youtube-icon">
                    </a>
                    
                    <a href="#" aria-label="SoundCloud">
                        <img src="assets/icons/soundcloud.svg" alt="SoundCloud" class="soundcloud-icon">
                    </a>
                    
                    <a href="#" aria-label="Bandcamp">
                        <img src="assets/icons/bandcamp.svg" alt="Bandcamp" class="bandcamp-icon">
                    </a>
                    
                    <a href="#" aria-label="Instagram">
                        <img src="assets/icons/instagram.svg" alt="Instagram" class="instagram-icon">
                    </a>
                </div>
            </nav>
            
        </div>
    </header>
    
    
    <!-- =========================
    MAIN CONTENT
    ========================== -->
    
    <main class="contact-page">
        <div class="container">
            
            <section class="contact-section">
                
                <div class="section-heading">
                    <h1>Contact</h1>
                    <p>For collaborations, playlists or simply sharing a thought.</p>
                </div>

                <div class="contact-card">
                    
                    <div class="contact-card__content">
                        <span class="contact-card__label">Kyoma Sounds</span>

                        <h2>Let's connect.</h2>

                        <p>
                            Whether it's about music, collaborations, playlists or simply a message,
                            I'm always happy to connect with people.
                        </p>

                        <a href="mailto:kyomasounds@gmail.com" class="contact-card__email">
                            kyomasounds@gmail.com
                        </a>

                        <div class="social-links contact-card__social-links">
                            <a href="#" aria-label="Spotify">
                                <img src="assets/icons/spotify.svg" alt="Spotify" class="spotify-icon">
                            </a>

                            <a href="#" aria-label="YouTube">
                                <img src="assets/icons/youtube.svg" alt="YouTube" class="youtube-icon">
                            </a>

                            <a href="#" aria-label="SoundCloud">
                                <img src="assets/icons/soundcloud.svg" alt="SoundCloud" class="soundcloud-icon">
                            </a>

                            <a href="#" aria-label="Bandcamp">
                                <img src="assets/icons/bandcamp.svg" alt="Bandcamp" class="bandcamp-icon">
                            </a>

                            <a href="#" aria-label="Instagram">
                                <img src="assets/icons/instagram.svg" alt="Instagram" class="instagram-icon">
                            </a>
                        </div>
                    </div>

                </div>
                
            </section>
            
        </div>
    </main>
    
</body>
</html>
