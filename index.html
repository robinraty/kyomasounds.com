<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS -->

    <title>Kyoma Sounds | Official Website</title>

<body>
    
    <!-- =========================
    HEADER / NAVBAR
    ========================== -->
    
    <header class="header">
        <!-- Background Video -->
        <video class="headerVideo" autoplay muted loop playsinline preload="auto">
            <source src="assets/background-images/video-kyoma-v2-1080p-ultra.mp4" type="video/mp4">
        </video>
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="navbar__logo">KYOMA</a>
                
                <!-- Menu Burger -->
                <button class="navbar__toggle" aria-label="Open menu">
                    <span></span>
                    <span></span>
                </button>
                
                <!-- Navigation Links -->
                <ul class="navbar__links">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="playlists.html">Playlists</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                
                <!-- Social Icons | Mobile Menu -->
                <div class="navbar__social-links">
                    <a href="https://open.spotify.com/artist/4o0RNVgB6vL98OQdazaY3g?si=lvSf1quMRXaGYrL1hKmFhA" aria-label="Spotify" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/spotify.svg" alt="Spotify" class="spotify-icon">
                    </a>
                    
                    <a href="https://www.youtube.com/@kyomasoundsmusic" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/youtube.svg" alt="YouTube" class="youtube-icon">
                    </a>
                    
                    <a href="https://soundcloud.com/kyomasounds" aria-label="SoundCloud" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/soundcloud.svg" alt="SoundCloud" class="soundcloud-icon">
                    </a>
                    
                    <a href="https://music.apple.com/be/artist/kyoma/1670567011?l" aria-label="Apple Music" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/applemusic.svg" alt="Apple Music" class="appleMusicIcon">
                    </a>
                    
                    <a href="https://www.instagram.com/kyomasounds" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/instagram.svg" alt="Instagram" class="instagram-icon">
                    </a>
                </div>
            </nav>
        </div>
        
        
        <!-- Hero Content -->
        <div class="hero-content">
            <h1 class="hero-title">Inner Peace</h1>
            
            <!-- Social Icons | Home Hero -->
            <div class="social-links">
                <a href="https://open.spotify.com/artist/4o0RNVgB6vL98OQdazaY3g?si=lvSf1quMRXaGYrL1hKmFhA" aria-label="Spotify" target="_blank" rel="noopener noreferrer">
