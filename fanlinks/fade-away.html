<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    
    <link rel="stylesheet" href="../styles/fanlinks.css" />
    <title>Kyoma — Fade Away</title>
</head>



<!-- ARTWORK SECTION -->
<body>
    <main class="fanlink">
        <section class="fanlink__artwork">
            <div class="artwork-card">
                <img
                src="/assets/artworks/artwork-square-fade-away.png"
                alt="Kyoma - Fade Away - artwork"
                class="artwork-card__image"
                />
            </div>
        </section>
        


<!-- LINKS SECTION -->

        <section class="fanlink__content" aria-label="Streaming links">

            <!-- TITLE -->
            <header class="track">
                <h1 class="track__title">Fade Away</h1>
                <p class="track__artist">Kyoma</p>
            </header>
            

            <!-- LINKS -->
            <div class="platform-list">
                <a href="#" class="platform-link">
                    <span class="platform-link__logo spotify-link">
                        <img src="/assets/logos/Spotify_logo.svg" alt="">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo apple-music-link">
                        <img src="/assets/logos/Apple_Music_logo.svg" alt="">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo youtube-link">
                        <img src="/assets/logos/YouTube_white_logo_2017.svg" alt="">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo soundcloud-link">
                        <img src="/assets/logos/Soundcloud_logo.svg" alt="">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>

                <a href="#" class="platform-link">
                    <span class="platform-link__logo bandcamp-link">
                        <img src="/assets/logos/Bandcamp-logo-white.svg" alt="">
                    </span>
                    <span class="platform-link__button">Buy</span>
                </a>

            </div>
        </section>
    </main>
</body>
</html>
