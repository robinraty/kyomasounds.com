<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/fanlinks.css" />

    <title>Kyoma & Sora - Koharu</title>
</head>

<body
    class="fanlink-body"
    style="
        --fanlink-background: url('../assets/artworks/kyoma\ &\ Sora\ -\ Koharu\ artwork.png');
    "
>
    <main class="fanlink">

        <!-- =========================
        ARTWORK SECTION
        ========================== -->

        <section class="fanlink__artwork">
            <div class="artwork-card">
                <img
                    src="../assets/artworks/kyoma & Sora - Koharu artwork.png"
                    alt="Kyoma & Sora - Koharu artwork"
                    class="artwork-card__image"
                />
            </div>
        </section>
        
        <!-- =========================
        LINKS SECTION
        ========================== -->

        <section class="fanlink__content" aria-label="Streaming links">
            
            <!-- Title -->
            <header class="track">
                <h1 class="track__title">Koharu</h1>
                <p class="track__artist">Kyoma & Sora</p>
            </header>
            
            <!-- Platform Links -->
            <div class="platform-list">

                <a href="#" class="platform-link">
                    <span class="platform-link__logo">
                        <img src="../assets/logos/Spotify_logo.svg" alt="Spotify">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo">
                        <img src="../assets/logos/Apple_Music_logo.svg" alt="Apple Music">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo">
                        <img src="../assets/logos/YouTube_white_logo_2017.svg" alt="YouTube">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo">
                        <img src="../assets/logos/Soundcloud_logo.svg" alt="SoundCloud">
                    </span>
                    <span class="platform-link__button">Play</span>
                </a>
                
                <a href="#" class="platform-link">
                    <span class="platform-link__logo">
                        <img src="../assets/logos/Bandcamp-logo-white.svg" alt="Bandcamp">
                    </span>
                    <span class="platform-link__button">Buy</span>
                </a>
                
            </div>

            <!-- Social Icons -->
            <div class="fanlink__social-links">
                <a href="#" aria-label="Spotify">
                    <img src="../assets/icons/spotify.svg" alt="Spotify" class="spotify-icon">
                </a>
                
                <a href="#" aria-label="YouTube">
                    <img src="../assets/icons/youtube.svg" alt="YouTube" class="youtube-icon">
                </a>
                
                <a href="#" aria-label="SoundCloud">
                    <img src="../assets/icons/soundcloud.svg" alt="SoundCloud" class="soundcloud-icon">
                </a>
                
                <a href="#" aria-label="Bandcamp">
                    <img src="../assets/icons/bandcamp.svg" alt="Bandcamp" class="bandcamp-icon">
                </a>
                
                <a href="#" aria-label="Instagram">
                    <img src="../assets/icons/instagram.svg" alt="Instagram" class="instagram-icon">
                </a>
            </div>
            
            <a href="../index.html" class="fanlink__site-link">kyomasounds.com</a>
        </section>
    </main>
</body>
</html>
