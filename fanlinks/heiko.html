<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/fanlinks.css" />
    
    <!-- Favicons -->
    <link rel="icon" href="../assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
    
    <title>Kyoma - Heiko</title>
</head>

<body
class="fanlink-body"
style="
--fanlink-background: url('../assets/background-images/heiko-background.webp');
"
>
<main class="fanlink">
    
    <!-- =========================
    ARTWORK SECTION
    ========================== -->
    
    <section class="fanlink__artwork">
        <div class="artwork-card">
            <img
            src="../assets/artworks/heiko-large.webp"
            alt="Kyoma - Fade Away artwork"
            class="artwork-card__image"
            />
        </div>
    </section>
    
    <!-- =========================
    LINKS SECTION
    ========================== -->
    
    <section class="fanlink__content" aria-label="Streaming links">
        
        <!-- Title -->
        <header class="track">
            <h1 class="track__title">Heiko</h1>
            <p class="track__artist">Kyoma</p>
        </header>
        
        <!-- Platform Links -->
        <div class="platform-list">
            
            <a href="https://open.spotify.com/track/0XuHb3CKKinP7Se00aTm8V?si=b0fde761e6634036" class="platform-link" target="_blank" rel="noopener noreferrer">
                <span class="platform-link__logo">
                    <img src="../assets/logos/Spotify_logo.svg" alt="Spotify">
                </span>
                <span class="platform-link__button">Play</span>
            </a>
            
            <a href="https://music.apple.com/be/album/heiko-single/1740428925" class="platform-link" target="_blank" rel="noopener noreferrer">
                <span class="platform-link__logo">
                    <img src="../assets/logos/Apple_Music_logo.svg" alt="Apple Music">
                </span>
                <span class="platform-link__button">Play</span>
            </a>
            
            <a href="https://www.youtube.com/watch?v=mHwuAuz47gE" class="platform-link" target="_blank" rel="noopener noreferrer">
                <span class="platform-link__logo">
                    <img src="../assets/logos/YouTube_white_logo_2017.svg" alt="YouTube">
                </span>
                <span class="platform-link__button">Play</span>
            </a>
            
            <a href="https://soundcloud.com/kyomasounds/kyoma-sora-heiko" class="platform-link" target="_blank" rel="noopener noreferrer">
                <span class="platform-link__logo">
                    <img src="../assets/logos/Soundcloud_logo.svg" alt="SoundCloud">
                </span>
                <span class="platform-link__button">Play</span>
            </a>
            
        </div>
        
        <!-- Social Icons -->
        <div class="fanlink__social-links">
            <a href="https://open.spotify.com/artist/4o0RNVgB6vL98OQdazaY3g?si=lvSf1quMRXaGYrL1hKmFhA" aria-label="Spotify" target="_blank" rel="noopener noreferrer">
                <img src="../assets/icons/spotify.svg" alt="Spotify" class="spotify-icon">
            </a>
            
            <a href="https://www.youtube.com/@kyomasoundsmusic" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
                <img src="../assets/icons/youtube.svg" alt="YouTube" class="youtube-icon">
            </a>
            
            <a href="https://soundcloud.com/kyomasounds" aria-label="SoundCloud" target="_blank" rel="noopener noreferrer">
                <img src="../assets/icons/soundcloud.svg" alt="SoundCloud" class="soundcloud-icon">
            </a>
            
            <a href="https://music.apple.com/be/artist/kyoma/1670567011?l" aria-label="Apple Music" target="_blank" rel="noopener noreferrer">
                <img src="../assets/icons/applemusic.svg" alt="Apple Music" class="appleMusicIcon">
            </a>
            
            <a href="https://www.instagram.com/kyomasounds" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
                <img src="../assets/icons/instagram.svg" alt="Instagram" class="instagram-icon">
            </a>
        </div>
        
        <a href="../index.html" class="fanlink__site-link">kyomasounds.com</a>
    </section>
</main>
</body>
</html>
